name: NanoWSP natural law N1
on:
  pull_request:
    paths:
      - 'lab/nanowsp/natural_law.py'
      - 'lab/nanowsp/PLAN_NATURAL.md'
      - '.github/workflows/nanowsp-natural-law.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Fetch fixed corpus
        run: |
          mkdir -p lab/data/shakespeare_char
          curl --fail --location --retry 3 https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o lab/data/shakespeare_char/input.txt
          echo '86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed  lab/data/shakespeare_char/input.txt' | sha256sum -c -
      - name: Construct and evaluate natural-language model
        run: python -u lab/nanowsp/natural_law.py --corpus lab/data/shakespeare_char/input.txt --out lab/runs/natural_n1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanowsp-natural-n1
          path: lab/runs/natural_n1/
          if-no-files-found: warn
