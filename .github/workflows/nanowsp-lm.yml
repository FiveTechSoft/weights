name: NanoWSP-LM synthesis
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'programs/**'
      - 'tests/test_context_ridge.py'
      - '.github/workflows/nanowsp-lm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_context_ridge.py -q
      - name: Obtain corpus
        run: |
          mkdir -p lab/data/shakespeare_char lab/runs
          if [ ! -s lab/data/shakespeare_char/input.txt ]; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o lab/data/shakespeare_char/input.txt
          fi
          sha256sum lab/data/shakespeare_char/input.txt
      - name: Synthesize spectral and randomized feature arms
        run: |
          set -o pipefail
          for variant in v6 v6_random_features; do
            python -m engine.wsplang programs/synthesize_nanowsp_lm_${variant}.wspl --run | tee lab/runs/nanowsp_lm_${variant}_synthesis.log
            test -s models/nanowsp_lm_${variant}/model.safetensors
          done
      - name: Create matched random and gradient-trained controls
        run: python lab/run_spectral_controls.py
      - name: Evaluate all arms on held-out corpus
        run: |
          for variant in v6 v6_random_features v6_random v6_trained; do
            sha256sum models/nanowsp_lm_${variant}/model.safetensors
            python lab/verify_llmness.py --nanogpt-ckpt models/nanowsp_lm_${variant}/model.safetensors --n-head 4 --corpus lab/data/shakespeare_char/input.txt --holdout-frac 0.1 --eval-chars 8000 --out lab/runs/nanowsp_lm_${variant}_llmness.json
          done
      - name: Report and enforce V6 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = {v: json.loads(Path(f'lab/runs/nanowsp_lm_{v}_llmness.json').read_text()) for v in ('v6', 'v6_random_features', 'v6_random', 'v6_trained')}
          scores = {v: r['L1']['nll'] for v,r in reports.items()}
          r = reports['v6']
          gates = dict(nll_target=scores['v6'] < 2.0, beats_ngram=scores['v6'] < min(r['L1']['ngram_ladder_nll'].values()), beats_random=scores['v6'] < scores['v6_random'], beats_random_features=scores['v6'] < scores['v6_random_features'], beats_trained=scores['v6'] < scores['v6_trained'], context=r['L2_long_context']['verdict']=='PASSES', generation=r['GEN']['verdict']=='PASSES', icl=r['L3_icl']['verdict']=='PASSES')
          summary=dict(scores=scores,gates=gates)
          Path('lab/runs/nanowsp_lm_v6_comparison.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          assert all(gates[k] for k in ('nll_target','beats_ngram','beats_random','beats_random_features','context','generation')), summary
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanowsp-lm-v6-results
          path: |
            lab/runs/nanowsp_lm_*
            models/nanowsp_lm_v6*/model.safetensors
            models/nanowsp_lm_v6*/model.train.json
          if-no-files-found: warn
