name: NanoWSP natural language N24
on:
  pull_request:
    paths:
      - 'lab/nanowsp/natural_n24.py'
      - 'lab/nanowsp/PLAN_N24.md'
      - 'lab/nanowsp/corpora/time_machine_35.txt'
      - '.github/workflows/nanowsp-natural-n24.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1
      - run: git hash-object lab/nanowsp/corpora/time_machine_35.txt | grep -Fx 419c78ce03f41984ef14913739b48d9332bd2801
      - run: python -u lab/nanowsp/natural_n24.py --corpus lab/nanowsp/corpora/time_machine_35.txt --out lab/runs/n24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanowsp-natural-n24
          path: lab/runs/n24/report.json
