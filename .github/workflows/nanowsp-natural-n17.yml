name: NanoWSP natural language N17
on:
  pull_request:
    paths:
      - 'lab/nanowsp/natural_n17.py'
      - 'lab/nanowsp/PLAN_N17.md'
      - '.github/workflows/nanowsp-natural-n17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: curl -fL https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt -o /tmp/shakespeare.txt
      - run: python -u lab/nanowsp/natural_n17.py --corpus /tmp/shakespeare.txt --out lab/runs/n17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanowsp-natural-n17
          path: lab/runs/n17/report.json
