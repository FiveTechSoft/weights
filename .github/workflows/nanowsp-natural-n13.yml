name: NanoWSP natural law N13
on:
  pull_request:
    paths:
      - 'lab/nanowsp/natural_n11.py'
      - 'lab/nanowsp/natural_n12.py'
      - 'lab/nanowsp/natural_n13.py'
      - '.github/workflows/nanowsp-natural-n13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -u lab/nanowsp/natural_n11.py --out lab/runs/n11
      - run: python -u lab/nanowsp/natural_n12.py --out lab/runs/n12
      - run: python -u lab/nanowsp/natural_n13.py --out lab/runs/n13
      - run: python -c "import json; assert json.load(open('lab/runs/n13/report.json'))['gate']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanowsp-natural-n13
          path: |
            lab/runs/n11/report.json
            lab/runs/n12/report.json
            lab/runs/n13/report.json
            lab/runs/n13/000.pt
            lab/runs/n13/099.pt
