name: WSPLang primitive skills
on:
  pull_request:
    paths:
      - 'engine/**'
      - 'programs/primitive_*.wspl'
      - 'lab/run_primitives.py'
      - 'lab/run_composition.py'
      - 'lab/run_register.py'
      - 'lab/run_discovered_affine.py'
      - 'programs/discover_affine.wspl'
      - 'programs/register/**'
      - '.github/workflows/wsp-primitives.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Compile through WSPLang
        run: |
          python -m engine.wsplang programs/primitive_copy.wspl --run
          python -m engine.wsplang programs/primitive_associate.wspl --run
      - name: Evaluate persisted weights
        run: python lab/run_primitives.py
      - name: Compile composed skills through WSPLang
        run: python -m engine.wsplang programs/primitive_composition.wspl --run
      - name: Evaluate same-checkpoint composition and selective ablations
        run: python lab/run_composition.py
      - name: Compile register programs through WSPLang
        run: python -m engine.wsplang programs/primitive_register.wspl --run
      - name: Verify register programs
        run: python lab/run_register.py
      - name: Discover capability through WSPLang
        run: python -m engine.wsplang programs/discover_affine.wspl --run
      - name: Verify discovered checkpoint on unseen pairs
        run: python lab/run_discovered_affine.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsp-primitives
          path: |
            models/primitives/*.safetensors
            lab/runs/nanowsp_primitives.json
            lab/runs/nanowsp_composition.json
            lab/runs/nanowsp_register.json
            lab/runs/nanowsp_discovered_affine.json
