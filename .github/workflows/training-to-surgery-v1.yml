name: Training-to-Surgery Benchmarks (v1, v2, v3)

on:
  push:
    branches:
      - main
    paths:
      - 'benchmarks/**'
      - '.github/workflows/training-to-surgery-v1.yml'
      - 'requirements.txt'
      - 'tests/test_training_to_surgery_benchmarks.py'
      - 'tests/test_wsplang_karpathy_nanogpt.py'
      - 'tests/test_nanogpt_runtime_contract.py'
      - 'tests/test_llmness_gate.py'
      - 'tests/test_wsp_arch.py'
      - 'tests/test_wsp_train.py'
      - 'tests/test_wsp_synth.py'
      - 'engine/nanogpt_runtime.py'
      - 'engine/wsplang.py'
      - 'engine/wsp_arch.py'
      - 'engine/wsp_train.py'
      - 'engine/wsp_synth.py'
      - 'lab/llmness.py'
      - 'lab/nano3lib.py'
      - 'lab/verify_llmness.py'
      - 'lab/verify_official_karpathy_parity.py'
      - 'lab/verify_karpathy_vendorized.py'
      - 'lab/reference/**'
      - 'programs/build_karpathy_nanogpt.wspl'
      - 'programs/arch/**'
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/training-to-surgery-v1.yml'
      - 'requirements.txt'
      - 'tests/test_training_to_surgery_benchmarks.py'
      - 'tests/test_wsplang_karpathy_nanogpt.py'
      - 'tests/test_nanogpt_runtime_contract.py'
      - 'tests/test_llmness_gate.py'
      - 'tests/test_wsp_arch.py'
      - 'tests/test_wsp_train.py'
      - 'tests/test_wsp_synth.py'
      - 'engine/nanogpt_runtime.py'
      - 'engine/wsplang.py'
      - 'engine/wsp_arch.py'
      - 'engine/wsp_train.py'
      - 'engine/wsp_synth.py'
      - 'lab/llmness.py'
      - 'lab/nano3lib.py'
      - 'lab/verify_llmness.py'
      - 'lab/verify_official_karpathy_parity.py'
      - 'lab/verify_karpathy_vendorized.py'
      - 'lab/reference/**'
      - 'programs/build_karpathy_nanogpt.wspl'
      - 'programs/arch/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run Unit Tests for Benchmarks
        run: |
          python -m unittest tests/test_training_to_surgery_benchmarks.py
          python -m unittest tests/test_wsplang_karpathy_nanogpt.py
          python -m unittest tests/test_nanogpt_runtime_contract.py
          python -m unittest tests/test_llmness_gate.py
          python -m unittest tests/test_wsp_arch.py
          python -m unittest tests/test_wsp_train.py
          python -m unittest tests/test_wsp_synth.py

      - name: Compile nanoGPT W0 from its WSPLang architecture
        run: python engine/wsplang.py programs/build_karpathy_nanogpt.wspl --run

      - name: Run Independent Karpathy nanoGPT Parity Verification
        run: |
          python lab/verify_official_karpathy_parity.py
          python lab/verify_karpathy_vendorized.py

      - name: Run Benchmark v1 (Baseline Instrumentation & Replay)
        run: >-
          python benchmarks/training_to_surgery_v1.py
          --device cpu
          --seed 7
          --steps 100
          --out runs/ci_training_to_surgery_v1

      - name: Assert v1 generated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runs/ci_training_to_surgery_v1/report.json').read_text())
          scores = report['scores']
          assert report['steps'] == 100, report
          assert report['delta_l2'] > 0, report
          assert abs(scores['trained_model'] - scores['direct_delta_replay']) < 1e-7, scores
          assert 'norm_matched_random_placebo' in scores, scores
          print('CI v1 checks passed:', scores)
          PY

      - name: Run Benchmark v2 (Closed-Form Dual Ridge Compiler)
        run: >-
          python benchmarks/training_to_surgery_v2.py
          --device cpu
          --seed 7
          --steps 100
          --out runs/ci_training_to_surgery_v2

      - name: Assert v2 generated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runs/ci_training_to_surgery_v2/report_v2.json').read_text())
          m = report['metrics']
          assert m['arm2_wsplang_closed_form_surgery']['backprop_steps'] == 0
          assert report['verdict']['placebo_eliminated'] is True
          assert m['arm2_wsplang_closed_form_surgery']['train_accuracy'] >= 0.99
          print('CI v2 checks passed')
          PY

      - name: Run Benchmark v3 (Multi-Seed Meta-Transfer Compiler)
        run: >-
          python benchmarks/training_to_surgery_v3_meta_transfer.py
          --device cpu
          --seed 42
          --n_meta_tasks 5
          --n_test_tasks 5
          --steps 100
          --out runs/ci_training_to_surgery_v3

      - name: Assert v3 generated report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runs/ci_training_to_surgery_v3/report_v3.json').read_text())
          m = report['metrics_summary']
          assert m['arm2_meta_learned_surgery']['backprop_steps'] == 0
          assert m['arm2_meta_learned_surgery']['access_to_target_sgd_delta'] is False
          assert report['verdict']['meta_learning_supported'] is True
          assert m['meta_transfer_fidelity']['mean_cosine_similarity'] > 0.95
          print('CI v3 checks passed, cosine similarity:', m['meta_transfer_fidelity']['mean_cosine_similarity'])
          PY

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-to-surgery-reports
          path: runs/ci_training_to_surgery_*
          if-no-files-found: warn
          retention-days: 14
