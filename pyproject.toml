[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weights-wsp"
version = "0.8.3"
description = "Weight-Space Programming (WSP): inspect, edit and compare LLM weights without gradient steps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

# Dependency source of truth is requirements.txt (used by CI); install with:
#   pip install -r requirements.txt
# or for the dev extra:
#   pip install -r requirements-dev.txt

[tool.setuptools]
py-modules = ["wsp"]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "skip: tests that need local models/GPU (auto-skipped via skipUnless)",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "lab",
    "blog_prompts",
    "dist",
    "hf_cache",
    ".venv-mcp",
]

[tool.ruff.lint]
# Conservative gate: correctness-critical rules only (syntax/imports/unused).
# Legacy style rules (E741 ambiguous names, E702 semicolons) are excluded on
# purpose -- they are pervasive in engine/wsp.py/ws_runner.py and mass-fixing
# them would churn the codebase without behavior gain.
select = ["E4", "E9", "F"]
ignore = [
    "E741",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap before imports (unittest/script pattern)
"tests/*" = ["E402"]
"rig/*" = ["E402"]
"scripts/*" = ["E402"]
"challenges/*" = ["E402"]
"benchmarks/*" = ["E402"]
"exp8_control/*" = ["E402"]
"data/*" = ["E402"]
"engine/*" = ["E402"]
"wsp.py" = ["E402"]
